name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: |
          bash -n install.sh
          zsh -n lid.zsh
          zsh tests/lid.zsh
      - name: Build and test brightness controller
        run: |
          swiftc -O LidBrightness.swift -o /tmp/lid-brightness -framework CoreGraphics -framework IOKit
          /tmp/lid-brightness --self-test
